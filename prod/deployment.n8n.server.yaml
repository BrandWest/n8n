apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: n8n
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      service: n8n
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        service: n8n
    spec:
      securityContext:           
        fsGroup: 3000            
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 3000:3000 /home/node/.n8n && chmod -R 755 /home/node/.n8n"]
          volumeMounts:
            - name: n8n-claim0
              mountPath: /home/node/.n8n
          securityContext:
            runAsUser: 0
      containers:
        - command:
            - n8n
          args:
            - start
          env:
            - name: WEBHOOK_URL
              value: https://<path:secret/data/apps/n8n#n8n_internal_url>
            - name: N8N_VERSION_CONTROL_ENABLED
              value: "true"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_VERSION_CONTROL_GIT_USER_NAME
              value: "<path:argocd/data/argocd-vault-plugin/git#git_user_name>"
            - name: N8N_VERSION_CONTROL_GIT_USER_EMAIL
              value: "<path:argocd/data/argocd-vault-plugin/git#git_user_email>"
            - name: N8N_VERSION_CONTROL_GIT_REPO_URL
              value: "<path:argocd/data/argocd-vault-plugin/git#git_repo_url>"
            - name: N8N_VERSION_CONTROL_GIT_PRIVATE_KEY
              value: "<path:argocd/data/argocd-vault-plugin/git#git_private_key>"
            - name: N8N_HOST
              value: <path:secret/data/apps/n8n#n8n_internal_url>
            - name: N8N_METRICS
              value: "true"
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: <path:secret/data/apps/n8n#n8n_internal_postgres_url>
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_USER_FOLDER
              value: /home/node/.n8n
            - name: N8N_SECURE_COOKIE
              value: "true"
            - name: N8N_PROTOCOL
              value: "https"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_ENDPOINT_REST
              value: "rest"
            - name: N8N_LOG_LEVEL
              value: "info"           
            - name: N8N_SSL_KEY
              value: "/etc/ssl/certs/n8n/tls.key"
            - name: N8N_SSL_CERT
              value: "/etc/ssl/certs/n8n/tls.crt"
            - name: N8N_PAYLOAD_SIZE_MAX
              value: "16"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "168"
            - name: EXECUTIONS_PRUN_MAX_COUNT
              vault: "1000"
            - name: "EXECUTIONS_PRUNE_TIMEOUT"
              vaule: "7"
            - name: N8N_CONCURRENCY_PRODUCTION_LIMIT
              value: "10"
            - name: N8N_AVAILABLE_ENV_VARS
              vaule: VAULT_ADDR,VAULT_ROLE_ID,VAULT_SECRET_ID
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_NON_ROOT_PASSWORD
            - name: VAULT_ADDR
              valueFrom:
                secretKeyRef:
                  name: n8n-vault-creds
                  key: VAULT_ADDR
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: n8n-vault-creds
                  key: VAULT_ROLE_ID
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: n8n-vault-creds
                  key: VAULT_SECRET_ID
          image: n8nio/n8n
          name: n8n
          securityContext:
            runAsUser: 3000
            runAsGroup: 3000
          ports:
            - containerPort: 5678
              name: n8n-internal
              protocol: TCP
            # - containerPort: 5678
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-claim0
            - name: tls-certs
              mountPath: /etc/ssl/certs/n8n
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: n8n-claim0
          persistentVolumeClaim:
            claimName: n8n-claim0
        - name: n8n-secret
          secret:
            secretName: n8n-secret
        - name: postgres-secret
          secret:
            secretName: postgres-secret
        - name: tls-certs
          secret:
            secretName: n8n-tls-secret         
