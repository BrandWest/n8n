apiVersion: v1
kind: Secret
metadata:
  namespace: n8n
  name: postgres-secret
  annotations:
    avp.kubernetes.io/path: "argocd/data/argocd-vault-plugin/n8n"
type: Opaque
stringData:
  POSTGRES_USER: "<n8n_internal_postgres_root_username>"
  POSTGRES_PASSWORD: "<n8n_internal_postgres_root_password>"
  POSTGRES_DB: n8n
  POSTGRES_NON_ROOT_USER: "<n8n_internal_postgres_username>"
  POSTGRES_NON_ROOT_PASSWORD: "<n8n_internal_postgres_password>"

---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret 
  namespace: n8n
  annotations:
    avp.kubernetes.io/path: "argocd/data/argocd-vault-plugin/cloudflare"
type: Opaque
stringData:
  api-token: <api-token>

---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-vault-creds
  namespace: n8n  
type: Opaque
stringData:
  VAULT_ADDR: <path:agrocd/data/argocd-vault-plugin/vault#vault_url>
  VAULT_ROLE_ID: <path:argocd/data/argocd-vault-plugin/n8n#vault_role_id>
  VAULT_SECRET_ID: <path:argocd/data/argocd-vault-plugin/vault#vaultsecret_id>
  VAULT_ROTATION_TOTKEN: <path:argocd/data/argocd-vault-plugin/n8n#vault_rotation_key>
