# vault-secret-rotation-cronjob.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-secret-rotation
  namespace: n8n
spec:
  schedule: "0 2 1 * *"  # 2 AM on the 1st of every month
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: vault-secret-rotator
          containers:
          - name: rotate
            image: hashicorp/vault:latest
            env:
            - name: VAULT_ADDR
              value: <path:argocd/data/argocd-vault-plugin/vault#vault_url>
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-rotation-token
                  key: token
            command:
            - /bin/sh
            - -c
            - |
              # Generate new Secret ID
              NEW_SECRET_ID=$(vault write -field=secret_id -f auth/approle/role/n8n-role/secret-id)
              
              # Update the Kubernetes secret
              kubectl patch secret n8n-vault-creds -n n8n \
                -p "{\"stringData\":{\"VAULT_SECRET_ID\":\"$NEW_SECRET_ID\"}}"
              
              # Restart n8n to pick up new secret
              kubectl rollout restart deployment/n8n -n n8n
              
              echo "Secret ID rotated successfully"
          restartPolicy: OnFailure